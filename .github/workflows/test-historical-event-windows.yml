
name: Test Historical Event Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-historical-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact historical event windows
        run: python test_historical_event_window.py

