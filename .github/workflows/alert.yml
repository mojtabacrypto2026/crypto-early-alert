name: Crypto Early Alert

on: workflow_dispatch: schedule: - cron: "*/5 * * * *"

permissions: contents: write

concurrency: group: crypto-early-alert cancel-in-progress: false

jobs: scan: runs-on: ubuntu-latest timeout-minutes: 15

 
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Syntax check
    run: |
      python -m py_compile scanner.py
      python -m py_compile performance_tracker.py
      python -m py_compile ws_orderbook_radar.py

  - name: Install WebSocket client
    continue-on-error: true
    run: |
      python -m pip install --disable-pip-version-check --no-input "websocket-client==1.8.0"

  - name: Start WebSocket OBI radar in background
    continue-on-error: true
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: |
      python ws_orderbook_radar.py --seconds 210 > ws_obi_radar.log 2>&1 &
      echo $! > ws_obi_radar.pid

  - name: Run Nobitex Early Move Radar
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: python scanner.py

  - name: Wait for WebSocket OBI radar
    if: always()
    run: |
      if [ -f ws_obi_radar.pid ]; then
        PID="$(cat ws_obi_radar.pid)"
        wait "$PID" || true
      fi

  - name: Show WebSocket OBI log
    if: always()
    run: |
      if [ -f ws_obi_radar.log ]; then
        tail -n 160 ws_obi_radar.log
      fi

  - name: Track alert performance
    if: always()
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: python performance_tracker.py

  - name: Save radar, OBI and performance state
    if: always()
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add nobitex_early_radar_state.json
      git add nobitex_telegram_alert_state.json
      git add nobitex_signal_performance_state.json
      git add nobitex_performance_tracking_start.json
      git add nobitex_ws_orderbook_signal.json
      git add nobitex_ws_obi_alert_state.json
      git add nobitex_ws_raw_samples.jsonl

      if ! git diff --cached --quiet; then
        git commit -m "Update early radar, OBI and performance state"
      fi

      git push origin HEAD:main || (
        echo "Push rejected; rebasing once against latest main..."
        git pull --rebase origin main
        git push origin HEAD:main
      )
 
