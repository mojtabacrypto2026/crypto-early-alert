
name: Test Historical Resolution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile test_historical_resolution.py

      - name: Run read-only diagnostic
        run: python -u test_historical_resolution.py

