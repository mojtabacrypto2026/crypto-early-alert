name: Telegram Delivery Smoke Test

on: workflow_dispatch:

permissions: contents: read

jobs: telegram-smoke-test: runs-on: ubuntu-latest timeout-minutes: 2 steps: - name: Send one Telegram test message env: TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} run: | python - <<'PY' import json import os import sys import urllib.error import urllib.request

 
      token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
      chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

      if not token or not chat_id:
          print("TELEGRAM_TEST=FAIL: required GitHub secrets are missing.")
          sys.exit(1)

      url = "https://api.telegram.org/bot" + token + "/sendMessage"
      payload = {
          "chat_id": chat_id,
          "text": "✅ آزمایش اتصال تلگرام رادار نوبیتکس موفق بود. این فقط پیام آزمایشی است و سیگنال معاملاتی نیست.",
          "disable_web_page_preview": True,
      }
      request = urllib.request.Request(
          url,
          data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
          headers={"Content-Type": "application/json"},
          method="POST",
      )

      try:
          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.loads(response.read().decode("utf-8"))
      except urllib.error.HTTPError as exc:
          print(f"TELEGRAM_TEST=FAIL: HTTP status {exc.code}; response body was not printed.")
          sys.exit(1)
      except Exception as exc:
          print("TELEGRAM_TEST=FAIL:", type(exc).__name__)
          sys.exit(1)

      if result.get("ok") is True:
          print("TELEGRAM_TEST=PASS: Telegram API accepted the test message.")
      else:
          print(
              "TELEGRAM_TEST=FAIL: Telegram rejected the message.",
              "error_code=" + str(result.get("error_code", "unknown")),
              "description=" + str(result.get("description", "unknown")),
          )
          sys.exit(1)
      PY
 
